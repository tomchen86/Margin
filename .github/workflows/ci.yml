name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # This name is the required status check in .github/rulesets/main-integrity.json.
    name: check
    # A template repository has no project to check yet.
    if: ${{ !github.event.repository.is_template }}
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # The Xcode and simulator the project is built and tested with; swift-format comes with Xcode.
      XCODE_APP: /Applications/Xcode_26.6.app
      SIMULATOR_DEVICE: iPhone 17 Pro
      SIMULATOR_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-5
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: |
          sudo xcode-select --switch "$XCODE_APP"
          xcodebuild -version
      # A simulator of the job's own, as on a shared machine (AGENTS.md, rule 8). It is booted, and
      # the Files app opened once, before the tests: on a new simulator the system's document browser
      # takes longer to show the first time than a UI test waits for it.
      - name: Create the simulator
        run: |
          xcrun simctl list runtimes
          udid=$(xcrun simctl create margin-ci "$SIMULATOR_DEVICE" "$SIMULATOR_RUNTIME")
          echo "MARGIN_DESTINATION=id=$udid" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl launch "$udid" com.apple.DocumentsApp
          sleep 30
          xcrun simctl terminate "$udid" com.apple.DocumentsApp
      - name: Lint, format check, typecheck, tests, requirement trace
        run: bash scripts/check.sh
      - name: Keep the test results of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: reports/
          retention-days: 7
