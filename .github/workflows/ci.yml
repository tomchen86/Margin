name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # This name is the required status check in .github/rulesets/main-integrity.json.
    name: check
    # A template repository has no project to check yet.
    if: ${{ !github.event.repository.is_template }}
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # The Xcode and simulator the project is built and tested with; swift-format comes with Xcode.
      XCODE_APP: /Applications/Xcode_26.6.app
      MARGIN_DESTINATION: platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: |
          sudo xcode-select --switch "$XCODE_APP"
          xcodebuild -version
      - name: Lint, format check, typecheck, tests, requirement trace
        run: bash scripts/check.sh
      - name: Keep the test results of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: reports/
          retention-days: 7
